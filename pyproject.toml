[project]
name = "pcap-doctor"
version = "0.1.0"
description = "从 pcap 里定位网络慢/断的根因，并给出可核对的证据"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cheng Zhong" }]
dependencies = ["scapy>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
